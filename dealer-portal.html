<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Dealer Portal</title><link rel="stylesheet" href="styles.css"/></head>
<body>
<main class="section">
  <div class="container">
    <h1>Become a Seven Peaks Dealer</h1>
    <div class="grid-2">
      <div><h2>Application</h2><p>Submit dealer application with territory and capacity details.</p></div>
      <div><h2>Dealer Dashboard</h2><p>Lead routing, asset library, training docs, and quote performance.</p></div>
    </div>
    <form class="lead-form"><input placeholder="Business Name" required><input placeholder="Contact Name" required><input type="email" placeholder="Email" required><button class="btn">Become A Dealer</button></form>
  </div>
</main>
</body>
</html>
